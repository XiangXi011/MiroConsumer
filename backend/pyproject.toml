[project]
name = "miroconsumer-backend"
version = "0.7.1"
description = "MiroConsumer - AI-powered consumer propagation testing for concept and copy validation"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroConsumer Team" }
]

dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.0",
    "openai>=1.0.0",
    # Zep Cloud
    "zep-cloud==3.13.0",
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "PyMuPDF>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "python-dotenv>=1.2.2",
    "pydantic>=2.0.0",
    "bcrypt>=4.1.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "gunicorn>=22.0.0",
    "sentry-sdk[celery,flask,sqlalchemy]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pipreqs>=0.5.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "locust>=2.32.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=5.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
]

[tool.uv]
override-dependencies = [
    "cryptography>=46.0.7",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "filelock>=3.20.3",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "flask>=3.1.3",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "lxml>=6.1.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "marshmallow>=3.26.2",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "nltk>=3.9.4",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "pillow>=12.2.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "pygments>=2.20.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "pyjwt>=2.12.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "pypdf>=6.10.2",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "pytest>=9.0.3",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "python-dotenv>=1.2.2",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "python-multipart>=0.0.27",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "requests>=2.33.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "sentence-transformers>=5.4.1",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "transformers>=5.0.0",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "unstructured>=0.18.18",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "urllib3>=2.6.3",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "virtualenv>=20.36.1",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
    "werkzeug>=3.1.6",  # CVE-watchlist: legacy OASIS transitive pin; remove after camel-oasis>=0.3.0
]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
ignore-setters = true
fail-under = 80
exclude = ["tests", "alembic/versions"]
verbose = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    # External integrations requiring live API keys
    "backend/app/services/zep_*.py",
    # LLM-dependent modules that cannot be deterministically tested in CI
    "backend/app/services/ontology_generator.py",
    # Legacy OASIS profile generator (deprecated, superseded by consumer module)
    "backend/app/services/oasis_profile_generator.py",
]

[tool.coverage.report]
omit = [
    # External integrations requiring live API keys
    "backend/app/services/zep_*.py",
    # LLM-dependent modules that cannot be deterministically tested in CI
    "backend/app/services/ontology_generator.py",
    # Legacy OASIS profile generator (deprecated, superseded by consumer module)
    "backend/app/services/oasis_profile_generator.py",
]
fail_under = 80
show_missing = true
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E9",   # syntax and parser errors
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
ignore_missing_imports = true
