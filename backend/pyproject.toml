[project]
name = "miroconsumer-backend"
version = "0.1.0"
description = "MiroConsumer - AI-powered consumer propagation testing for concept and copy validation"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroConsumer Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.1.3",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    
    # Zep Cloud
    "zep-cloud==3.13.0",
    
    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.2.2",
    "pydantic>=2.0.0",
    "bcrypt>=4.1.0",
    "redis>=5.0.0",
    "rq>=1.16.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
override-dependencies = [
    "cryptography>=46.0.7",
    "filelock>=3.20.3",
    "flask>=3.1.3",
    "lxml>=6.1.0",
    "marshmallow>=3.26.2",
    "nltk>=3.9.4",
    "pillow>=12.2.0",
    "pygments>=2.20.0",
    "pyjwt>=2.12.0",
    "pypdf>=6.10.2",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "sentence-transformers>=5.4.1",
    "transformers>=5.0.0",
    "unstructured>=0.18.18",
    "urllib3>=2.6.3",
    "virtualenv>=20.36.1",
    "werkzeug>=3.1.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["app"]
