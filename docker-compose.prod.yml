services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${MIROCONSUMER_FRONTEND_IMAGE:-miroconsumer-frontend:latest}
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${MIROCONSUMER_BACKEND_IMAGE:-miroconsumer-backend:latest}
    command: 'gunicorn "app:create_app()" --bind 0.0.0.0:5001 --workers 2 --threads 4 --timeout 300'
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg://miroconsumer:miroconsumer@postgres:5432/miroconsumer}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-rq}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-miroconsumer}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-miroconsumer}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miroconsumer-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_data:/app/backend/data
    expose:
      - "5001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${MIROCONSUMER_WORKER_IMAGE:-miroconsumer-worker:latest}
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg://miroconsumer:miroconsumer@postgres:5432/miroconsumer}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-rq}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
    depends_on:
      - backend
      - postgres
      - redis
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_data:/app/backend/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miroconsumer
      POSTGRES_USER: miroconsumer
      POSTGRES_PASSWORD: miroconsumer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miroconsumer -d miroconsumer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-04-03T16-13-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-miroconsumer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miroconsumer-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

volumes:
  backend_uploads:
  backend_data:
  postgres_data:
  redis_data:
  minio_data:
