services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ${MIROCONSUMER_FRONTEND_IMAGE:-miroconsumer-frontend:latest}
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ${MIROCONSUMER_BACKEND_IMAGE:-miroconsumer-backend:latest}
    command: >-
      sh -c 'gunicorn "app:create_app()" --bind 0.0.0.0:5001
      --workers "$${GUNICORN_WORKERS:-4}"
      --threads "$${GUNICORN_THREADS:-4}"
      --timeout "$${GUNICORN_TIMEOUT:-300}"'
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg://miroconsumer:miroconsumer@postgres:5432/miroconsumer}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-rq}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOCK_BACKEND: ${LOCK_BACKEND:-auto}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-miroconsumer}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-miroconsumer}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miroconsumer-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_data:/app/backend/data
    expose:
      - "5001"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    image: ${MIROCONSUMER_WORKER_IMAGE:-miroconsumer-worker:latest}
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: ${DB_URL:-postgresql+psycopg://miroconsumer:miroconsumer@postgres:5432/miroconsumer}
      QUEUE_BACKEND: ${QUEUE_BACKEND:-rq}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOCK_BACKEND: ${LOCK_BACKEND:-auto}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
    depends_on:
      - backend
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; q=os.getenv('RQ_QUEUE_NAME','default'); print(f'worker queue {q} health probe ok')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_data:/app/backend/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miroconsumer
      POSTGRES_USER: miroconsumer
      POSTGRES_PASSWORD: miroconsumer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miroconsumer -d miroconsumer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml", "-config.expand-env=true"]
    environment:
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
    volumes:
      - ./ops/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - backend
      - worker
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2026-04-03T16-13-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-miroconsumer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miroconsumer-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      # MinIO console is loopback-only; use SSH tunnel/VPN for remote administration.
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  image-signature-verify:
    image: cgr.dev/chainguard/cosign:latest
    profiles: ["verify"]
    entrypoint: ["/bin/sh", "-c"]
    environment:
      COSIGN_PUBLIC_KEY: ${COSIGN_PUBLIC_KEY:-}
      MIROCONSUMER_BACKEND_IMAGE: ${MIROCONSUMER_BACKEND_IMAGE:-miroconsumer-backend:latest}
      MIROCONSUMER_WORKER_IMAGE: ${MIROCONSUMER_WORKER_IMAGE:-miroconsumer-worker:latest}
      MIROCONSUMER_FRONTEND_IMAGE: ${MIROCONSUMER_FRONTEND_IMAGE:-miroconsumer-frontend:latest}
    command: >-
      set -eu;
      printf "%s" "$${COSIGN_PUBLIC_KEY}" > /tmp/cosign.pub;
      cosign verify --key /tmp/cosign.pub "$${MIROCONSUMER_BACKEND_IMAGE}";
      cosign verify --key /tmp/cosign.pub "$${MIROCONSUMER_WORKER_IMAGE}";
      cosign verify --key /tmp/cosign.pub "$${MIROCONSUMER_FRONTEND_IMAGE}"

volumes:
  backend_uploads:
  backend_data:
  postgres_data:
  redis_data:
  minio_data:


