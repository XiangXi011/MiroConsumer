name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run backend test suite
        working-directory: backend
        run: uv run --python 3.12 pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend Build And Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend node tests
        working-directory: frontend
        run: node --test tests/*.test.js tests/composables/*.test.js

  consumer-contract:
    name: Consumer API Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run consumer contract tests
        working-directory: backend
        run: >
          uv run --python 3.12 pytest
          tests/api/test_consumer_canonical_routes.py
          tests/api/test_phase6a_project_type_contract.py
          tests/api/test_consumer_society_runtime.py

  consumer-smoke:
    name: Consumer Golden Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run golden consumer smoke tests
        working-directory: backend
        run: >
          uv run --python 3.12 pytest
          tests/e2e/test_consumer_concept_test_golden_flow.py
          tests/e2e/test_consumer_golden_cases.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

      - name: Check for secrets
        run: |
          grep -r "SECRET_KEY=dev" .env* && echo "WARNING: Default secret key found" && exit 1 || true

  benchmark:
    name: Golden Case Benchmark
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run golden case benchmark
        run: |
          cd backend
          python -m pytest tests/e2e/test_consumer_golden_cases.py -v --tb=short -k "golden" || echo "Benchmark completed with non-zero exit (advisory)"
        continue-on-error: true
