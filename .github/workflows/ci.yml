name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check version consistency
        working-directory: backend
        run: uv run --python 3.12 python scripts/check_version_consistency.py --root ..

      - name: Check Python file encoding
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path("backend").rglob("*.py"):
              path.read_text(encoding="utf-8")
          print("All Python files are valid UTF-8")
          PY

      - name: Check for garbled Chinese characters
        run: |
          python - <<'PY'
          from pathlib import Path
          tokens = [
              "\u95b0",
              "\u95c1",
              "\u95c2",
              "\u95bb",
              "\u93bc",
              "\u7f01",
              "\u7f02",
              "\u9354",
              "\u9289",
              "\u9209",
              "\u951b",
              "\u951f",
              "\ufffd",
          ]
          matches = []
          for path in Path("backend/app").rglob("*.py"):
              text = open(path, 'r', encoding='utf-8').read()
              for token in tokens:
                  if token in text:
                      matches.append(f"{path}: U+{ord(token):04X}")
          if matches:
              raise SystemExit("Found garbled Chinese characters:\n" + "\n".join(matches))
          print("No garbled Chinese characters found")
          PY
      - name: Check for replacement characters
        run: |
          python - <<'PY'
          from pathlib import Path
          matches = []
          for path in Path("backend/app").rglob("*.py"):
              text = open(path, 'r', encoding='utf-8').read()
              if "\ufffd" in text:
                  matches.append(str(path))
          if matches:
              raise SystemExit("Found Unicode replacement characters:\n" + "\n".join(matches))
          print("No Unicode replacement characters found")
          PY

      - name: Check Python docstring coverage
        working-directory: backend
        run: uv run --python 3.12 --with interrogate interrogate app --config pyproject.toml

      - name: Run backend test suite
        working-directory: backend
        run: uv run --python 3.12 pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Start integration dependencies
        run: docker compose -f docker-compose.test.yml up -d postgres redis minio

      - name: Wait for integration dependency sockets
        run: |
          python - <<'PY'
          import socket
          import time

          targets = {
              "postgres": ("127.0.0.1", 15432),
              "redis": ("127.0.0.1", 16379),
              "minio": ("127.0.0.1", 19000),
          }
          deadline = time.time() + 90
          pending = dict(targets)
          while pending and time.time() < deadline:
              for name, address in list(pending.items()):
                  try:
                      with socket.create_connection(address, timeout=2):
                          pending.pop(name)
                  except OSError:
                      pass
              if pending:
                  time.sleep(2)
          if pending:
              raise SystemExit(f"Timed out waiting for: {', '.join(sorted(pending))}")
          print("Integration dependencies are reachable")
          PY

      - name: Run backend integration tests
        working-directory: backend
        env:
          DB_URL: postgresql+psycopg://miroconsumer:miroconsumer@127.0.0.1:15432/miroconsumer_test
          REDIS_URL: redis://127.0.0.1:16379/0
          STORAGE_BACKEND: s3
          S3_ENDPOINT_URL: http://127.0.0.1:19000
          S3_BUCKET: miroconsumer-test
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: uv run --python 3.12 pytest tests/integration -q --no-cov

      - name: Stop integration dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  migration-smoke:
    name: Migration Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run Alembic upgrade/downgrade cycle
        working-directory: backend
        env:
          DB_URL: sqlite:///migration_smoke.db
          LLM_API_KEY: test-llm-key
          ZEP_API_KEY: test-zep-key
          SECRET_KEY: migration-smoke-secret-key-that-is-long-enough-32
          JWT_SECRET_KEY: migration-smoke-jwt-secret-key-that-is-long-enough-32
          CORS_ALLOW_ORIGINS: http://localhost:3000
        run: |
          uv run --python 3.12 alembic upgrade head
          uv run --python 3.12 alembic downgrade -1
          uv run --python 3.12 alembic upgrade +1

  frontend:
    name: Frontend Build And Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

  consumer-contract:
    name: Consumer API Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run consumer contract tests
        working-directory: backend
        run: >
          uv run --python 3.12 pytest
          tests/api/test_consumer_canonical_routes.py
          tests/api/test_phase6a_project_type_contract.py
          tests/api/test_consumer_society_runtime.py

  consumer-smoke:
    name: Consumer Golden Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run golden consumer smoke tests
        working-directory: backend
        run: >
          uv run --python 3.12 pytest
          tests/e2e/test_consumer_concept_test_golden_flow.py
          tests/e2e/test_consumer_golden_cases.py

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit

      - name: Check for secrets
        run: |
          grep -r "SECRET_KEY=dev" .env* && echo "WARNING: Default secret key found" && exit 1 || true

  benchmark:
    name: API Benchmark Regression Gate
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run API benchmarks
        working-directory: backend
        run: >
          uv run --python 3.12 pytest tests/benchmark
          --benchmark-only
          --benchmark-json benchmark-results.json

      - name: Document P2 legacy benchmark floor
        run: echo "P2 legacy benchmark floor: 15 percent; P3 gate uses 20 percent."

      - name: Block >20% performance regression
        working-directory: backend
        run: >
          uv run --python 3.12 python scripts/check_benchmark_regression.py
          --current benchmark-results.json
          --baseline tests/benchmark/baseline.json
          --max-regression 0.20

