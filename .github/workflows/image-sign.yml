name: Sign container images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to sign and verify
        required: false
        default: latest
  workflow_run:
    workflows: ["Build and push Docker image"]
    types: [completed]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign-and-verify:
    name: Cosign sign and verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image references
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "BACKEND_IMAGE=ghcr.io/${owner}/miroconsumer-backend:${IMAGE_TAG}"
            echo "WORKER_IMAGE=ghcr.io/${owner}/miroconsumer-worker:${IMAGE_TAG}"
            echo "FRONTEND_IMAGE=ghcr.io/${owner}/miroconsumer-frontend:${IMAGE_TAG}"
            echo "MONOLITH_IMAGE=ghcr.io/${owner}/miroconsumer:${IMAGE_TAG}"
          } >> "$GITHUB_ENV"

      - name: Sign images
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE" "$MONOLITH_IMAGE"; do
            cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$image"
          done

      - name: Verify image signatures
        shell: bash
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$COSIGN_PUBLIC_KEY" > cosign.pub
          for image in "$BACKEND_IMAGE" "$WORKER_IMAGE" "$FRONTEND_IMAGE" "$MONOLITH_IMAGE"; do
            cosign verify --key cosign.pub "$image"
          done
