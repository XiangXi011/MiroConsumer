server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}

scrape_configs:
  - job_name: miroconsumer-docker-json
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(miroconsumer_.*|.*backend.*|.*worker.*|.*frontend.*)'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            trace_id: trace_id
            span_id: span_id
            service: service
            tenant_id: tenant_id
            user_id: user_id
            error_code: error_code
      - labels:
          level:
          logger:
          service:
          trace_id:
          tenant_id:
          error_code:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message