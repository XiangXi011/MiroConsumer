x-dev-service: &dev-service
  build:
    context: .
    dockerfile: Dockerfile
  image: ${MIROCONSUMER_DEV_IMAGE:-miroconsumer:dev}
  restart: unless-stopped

services:
  frontend:
    <<: *dev-service
    command: npm run frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

  backend:
    <<: *dev-service
    command: npm run backend
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-miroconsumer}:${POSTGRES_PASSWORD:-miroconsumer}@postgres:5432/${POSTGRES_DB:-miroconsumer}
      QUEUE_BACKEND: ${MIROCONSUMER_DEV_QUEUE_BACKEND:-rq}
      REDIS_URL: ${MIROCONSUMER_DEV_REDIS_URL:-redis://redis:6379/0}
      STORAGE_BACKEND: ${MIROCONSUMER_DEV_STORAGE_BACKEND:-s3}
      S3_ENDPOINT: ${MIROCONSUMER_DEV_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-miroconsumer}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-miroconsumer}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-miroconsumer-dev-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/data:/app/backend/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miroconsumer}
      POSTGRES_USER: ${POSTGRES_USER:-miroconsumer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miroconsumer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2026-04-03T16-13-37Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-miroconsumer}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-miroconsumer-dev-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
